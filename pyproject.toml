[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-and-wifi"
version = "0.1.0"
description = "Day 62 of 100 Days of Code: a Flask site that lists London cafes from a CSV file and lets you add one."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
# Runtime dependencies are the three the assignment needs, nothing else.
dependencies = [
    "Flask>=3.0",
    "Flask-WTF>=1.2",
    "Bootstrap-Flask>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coffee_and_wifi = [
    "data/*.csv",
    "presentation/templates/*.html",
    "presentation/static/css/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
mypy_path = "src"
